<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1117">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' http: https: ws: wss:">
  <title>Swing Watchlist AI</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/watchlist">Swing Watchlist <span>AI</span></a>
    <nav class="nav">
      <a href="#/watchlist" data-nav="watchlist">Watchlist</a>
      <a href="#/settings" data-nav="settings">Settings</a>
    </nav>
    <div class="spacer"></div>
    <span id="live-badge" class="badge hidden" title="Live quote stream"><span class="dot"></span><span>Quotes</span></span>
    <span id="mode-badge" class="badge"><span class="dot"></span><span>Connecting…</span></span>
    <button id="theme-btn" class="btn icon-btn" title="Toggle theme" aria-label="Toggle theme"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.5a6.5 6.5 0 0 1 0 13z" fill="currentColor"/></svg></button>
  </header>
  <main id="view" aria-live="polite"><div class="loading">Loading…</div></main>
  <script src="js/api.js"></script>
  <script src="js/chart.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
